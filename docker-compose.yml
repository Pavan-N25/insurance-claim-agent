version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insur_claim_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Set POSTGRES_PASSWORD in your shell or a .env file — never hardcode here
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: insurance_claim_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: insur_claim_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insur_claim_backend
    restart: always
    environment:
      # Use a .env file or export these vars before running docker-compose up
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/insurance_claim_db
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - JWT_SECRET=${JWT_SECRET}
      - APP_ENV=${APP_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/backend/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: insur_claim_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
