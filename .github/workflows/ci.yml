name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements-dev.lock

    - name: Install Dependencies (locked versions)
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.lock

    - name: Run Pytest Test Suite
      run: |
        python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies (locked)
      working-directory: ./frontend
      run: npm ci

    - name: Build Production Frontend
      working-directory: ./frontend
      run: npm run build

  docker-build:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      run: |
        docker build -f backend/Dockerfile -t insur-backend:latest .

    - name: Build Frontend Docker Image
      run: |
        docker build -f frontend/Dockerfile -t insur-frontend:latest .
